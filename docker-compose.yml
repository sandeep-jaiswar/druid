services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      - CLUSTER_ID=cluster-1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  postgres:
    image: postgres:15.3
    container_name: postgres
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  druid:
    image: apache/druid:28.0.0
    container_name: druid
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      - druid_metadata_storage_type=postgresql
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=druid
      - druid_metadata_storage_connector_password=druid
      - druid_extensions_loadList=["postgresql-metadata-storage"]
      - druid_coordinator_startDelay=PT30S
      - druid_host=druid
    ports:
      - "8888:8888"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - druid_data:/opt/data
    depends_on:
      - postgres
    command: [ "coordinator" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/status/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  flask:
    build: ./flask_app
    container_name: flask
    environment:
      - KAFKA_BROKER=kafka:9092
    ports:
      - "5000:5000"
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  pgdata:
  kafka_data:
  druid_data:
