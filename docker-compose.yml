services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      - CLUSTER_ID=cluster-1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOO_MY_ID=1
      - ZOO_TICK_TIME=2000
      - ZOO_INIT_LIMIT=5
      - ZOO_SYNC_LIMIT=2
    volumes:
      - zk_data:/data
      - zk_datalog:/datalog
    restart: unless-stopped

  postgres:
    image: postgres:15.3
    container_name: postgres
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  druid-coordinator:
    image: apache/druid:28.0.0
    container_name: druid-coordinator
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - druid_metadata_storage_type=postgresql
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=druid
      - druid_metadata_storage_connector_password=druid
      - druid_extensions_loadList=["postgresql-metadata-storage","druid-kafka-indexing-service"]
      - druid_coordinator_startDelay=PT10S
      - druid_zk_service_host=zookeeper
      - druid_zk_paths_base=/druid
    ports:
      - "8081:8081"
    volumes:
      - druid_data:/opt/data
    depends_on:
      - postgres
      - zookeeper
    command: ["coordinator"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  druid-broker:
    image: apache/druid:28.0.0
    container_name: druid-broker
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - druid_metadata_storage_type=postgresql
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=druid
      - druid_metadata_storage_connector_password=druid
      - druid_extensions_loadList=["postgresql-metadata-storage","druid-kafka-indexing-service"]
      - druid_zk_service_host=zookeeper
      - druid_zk_paths_base=/druid
    ports:
      - "8082:8082"
    volumes:
      - druid_data:/opt/data
    depends_on:
      - postgres
      - zookeeper
      - druid-coordinator
    command: ["broker"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  druid-historical:
    image: apache/druid:28.0.0
    container_name: druid-historical
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - druid_metadata_storage_type=postgresql
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=druid
      - druid_metadata_storage_connector_password=druid
      - druid_extensions_loadList=["postgresql-metadata-storage","druid-kafka-indexing-service"]
      - druid_zk_service_host=zookeeper
      - druid_zk_paths_base=/druid
      - druid_segmentCache_locations=[{"path":"/opt/data/segment-cache","maxSize":10737418240}]
    ports:
      - "8083:8083"
    volumes:
      - druid_data:/opt/data
    depends_on:
      - postgres
      - zookeeper
      - druid-coordinator
    command: ["historical"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  druid-middlemanager:
    image: apache/druid:28.0.0
    container_name: druid-middlemanager
    environment:
      - JAVA_OPTS=-Xms64m -Xmx64m
      - druid_metadata_storage_type=postgresql
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=druid
      - druid_metadata_storage_connector_password=druid
      - druid_extensions_loadList=["postgresql-metadata-storage","druid-kafka-indexing-service"]
      - druid_zk_service_host=zookeeper
      - druid_zk_paths_base=/druid
      - druid_indexer_runner_javaOptsArray=["-server","-Xms256m","-Xmx256m","-Duser.timezone=UTC","-Dfile.encoding=UTF-8","-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"]
      - druid_indexer_fork_property_druid_processing_buffer_sizeBytes=25000000
    ports:
      - "8091:8091"
      - "8100-8105:8100-8105"
    volumes:
      - druid_data:/opt/data
    depends_on:
      - postgres
      - zookeeper
      - druid-coordinator
    command: ["middleManager"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  druid-router:
    image: apache/druid:28.0.0
    container_name: druid-router
    environment:
      - JAVA_OPTS=-Xms128m -Xmx128m
      - druid_metadata_storage_type=postgresql
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=druid
      - druid_metadata_storage_connector_password=druid
      - druid_extensions_loadList=["postgresql-metadata-storage","druid-kafka-indexing-service"]
      - druid_zk_service_host=zookeeper
      - druid_zk_paths_base=/druid
    ports:
      - "8888:8888"
    volumes:
      - druid_data:/opt/data
    depends_on:
      - postgres
      - zookeeper
      - druid-coordinator
      - druid-broker
    command: ["router"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  flask:
    build: ./flask_app
    container_name: flask
    environment:
      - KAFKA_BROKER=kafka:9092
    ports:
      - "5000:5000"
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  pgdata:
  kafka_data:
  druid_data:
  zk_data:
  zk_datalog:
